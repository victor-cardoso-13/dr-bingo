# Publica o Bingo da Vovó no GitHub Pages sempre que algo entra no "main".
# Este jogo é HTML/JS puro (sem build): roda os testes e publica só os arquivos do app.
# Se algum teste falhar, o site NÃO é atualizado.
name: Publicar o Bingo da Vovó

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Testar
        run: npm test

      - name: Separar só os arquivos do app
        run: |
          mkdir dist
          cp -R index.html manifest.webmanifest sw.js css src icons dist/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: publicar
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
