# Publica o Bingo da Vovó no GitHub Pages sempre que algo entra no "main".
# Este jogo é HTML/JS puro (sem build): roda os testes e publica só os arquivos do app.
# Se algum teste falhar, o site NÃO é atualizado.
name: Publicar o Bingo da Vovó

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testar
        run: npm test

      - name: Separar só os arquivos do app
        run: |
          mkdir dist
          cp -R index.html manifest.webmanifest sw.js css src icons dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: publicar
        uses: actions/deploy-pages@v4
